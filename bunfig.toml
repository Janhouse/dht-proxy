[install]
# Refuse to install npm package versions younger than this many seconds.
# 604800 = 7 days. Mitigates supply-chain attacks where a compromised
# maintainer publishes a malicious version: a 7-day cool-down gives the
# ecosystem time to spot and yank bad releases before we pull them in.
# Bun uses seconds (npm uses days, pnpm uses minutes).
minimumReleaseAge = 604800

# Add internal/trusted scopes here if any need to bypass the gate.
# Exact names only (no globs) — the @next/swc-* platform binaries MUST be
# listed too: they are optionalDependencies, so when quarantined bun silently
# drops them from the lockfile instead of failing, and `next build` then tries
# to download SWC via npm at build time (no npm in the Docker image → build
# breaks).
minimumReleaseAgeExcludes = [
  "next",
  "@next/env",
  "@next/swc-darwin-arm64",
  "@next/swc-darwin-x64",
  "@next/swc-linux-arm64-gnu",
  "@next/swc-linux-arm64-musl",
  "@next/swc-linux-x64-gnu",
  "@next/swc-linux-x64-musl",
  "@next/swc-win32-arm64-msvc",
  "@next/swc-win32-x64-msvc",
  "eslint-config-next",
  "@next/eslint-plugin-next",
]
